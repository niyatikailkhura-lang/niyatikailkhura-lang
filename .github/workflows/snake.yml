
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: niyatikailkhura-lang
          outputs: |
            dist/github-snake.svg?color_snake=%23FF9D91&color_dots=%23171416,%2334282A,%23743D4C,%23E88C91,%23FF9D91
            dist/github-snake-dark.svg?color_snake=%23FF9D91&color_dots=%23171416,%2334282A,%23743D4C,%23E88C91,%23FF9D91

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
